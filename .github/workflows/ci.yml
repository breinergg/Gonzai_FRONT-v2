name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compilar (producción)
        run: npx ng build --configuration production

      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high

  imagen-docker:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen web
        run: docker build -t gonzai-web:ci .
