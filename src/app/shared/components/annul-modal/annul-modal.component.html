<div class="modal-overlay overlay-top" (click)="cancel()">
  <div class="modal-card modal-small" (click)="$event.stopPropagation()">
    <div class="modal-header modal-header-danger">
      <div class="modal-header-left">
        <div class="modal-header-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
          </svg>
        </div>
        <span class="modal-title">{{ title }}</span>
      </div>
      <button class="modal-close" (click)="cancel()" [disabled]="loading">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <p class="delete-text">
        ¿Seguro que deseas anular <strong>{{ subject }}</strong>? El documento no se elimina: queda marcado como anulado y deja de sumar en los totales.
      </p>

      <div class="alert alert-warn" *ngIf="warning">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <span>{{ warning }}</span>
      </div>

      <div class="form-group">
        <label class="form-label">Motivo <span class="form-required">*</span></label>
        <textarea
          class="form-input form-textarea"
          [class.input-invalid]="touched && motivoError"
          [(ngModel)]="motivo"
          [maxlength]="max"
          rows="3"
          placeholder="Ej: Error al registrar la cantidad"
          (keydown.control.enter)="confirm()"></textarea>
        <div class="motivo-meta">
          <span class="field-error">{{ touched ? motivoError : '' }}</span>
          <span class="char-count" [class.char-over]="motivo.length > max">{{ motivo.length }}/{{ max }}</span>
        </div>
      </div>

      <div class="alert alert-error" *ngIf="error">{{ error }}</div>
    </div>

    <div class="modal-footer">
      <button class="btn-secondary" (click)="cancel()" [disabled]="loading">Cancelar</button>
      <button class="btn-danger" (click)="confirm()" [disabled]="loading">
        <span class="spinner spinner-sm spinner-light" *ngIf="loading"></span>
        {{ loading ? 'Anulando…' : 'Anular' }}
      </button>
    </div>
  </div>
</div>
